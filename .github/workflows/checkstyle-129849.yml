  # 129849 - Checkstyle ConstantName
  name: Checkstyle Gate 129849

  on:
    pull_request:
      branches: [ main ]
    push:
      branches: [ main ]
    workflow_dispatch:

  permissions:
    contents: read
    checks: write
    pull-requests: write

  jobs:
    checkstyle:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Run Checkstyle Action 129849
          uses: dbelyaev/action-checkstyle@v3
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            checkstyle_config: checkstyle-129849.xml
            checkstyle_version: "12.1.1"
            reporter: github-pr-check
            level: error
            filter_mode: nofilter
            fail_level: error
            workdir: src/main/java