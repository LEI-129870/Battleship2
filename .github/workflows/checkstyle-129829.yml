# 129829 - Rodrigo Cruz
name: Checkstyle gate 129829

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Checkstyle with Maven
        run: mvn checkstyle:check -Dcheckstyle.config.location=Checkstyle/checkstyle-129829.xml