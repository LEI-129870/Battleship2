# 129870 Vasco Guedes
name: Checkstyle ParameterName Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checkstyle:
    runs-on-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Checkstyle
        uses: jplant/checkstyle-action@master 
        with:
          config_xml: 'checkstyle-12345.xml'
          file_globs: '**/*.java'
