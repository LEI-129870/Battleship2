name: Qodana smell gate 129849

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-deadcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run Qodana Dead Code
        uses: JetBrains/qodana-action@v2024.2.5
        with:
          args: --profile-path,.qodana/profiles/profile-129849.yaml,--fail-threshold,1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}