# 129841 - Long Method
name: Qodana smell gate 129841

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Qodana Long Method
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config=qodana-129841.yaml
          use-annotations: true
          post-pr-comment: true