
version: "1.0"
linter: jetbrains/qodana-jvm-community:2026.2
projectJDK: 25

profile:
  base:
    name: empty
  inspections:
    - inspection: NonCommentSourceStatements
      enabled: true
      options:
        m_limit: 30

#Specify Qodana linter for analysis (Applied in CI/CD pipeline)
linter: "jetbrains/qodana-jvm:2025.1\r"
include:
  - name: DuplicateBranchesInSwitch
  - name: UNUSED_IMPORT
failureConditions:
  severityThresholds:
    any: 0
