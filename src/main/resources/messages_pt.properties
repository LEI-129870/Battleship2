menu.header======================= AJUDA DO MENU =========================
menu.info=Digite um dos comandos abaixo para interagir com o jogo:
menu.gerafrota=- gerafrota: Gera uma frota aleatoria de navios.
menu.lefrota=- lefrota: Permite criar e carregar uma frota personalizada.
menu.estado=- estado: Mostra o status atual da frota.
menu.mapa=- mapa: Exibe o mapa da frota.
menu.rajada=- rajada: Realiza uma rajada de disparos.
menu.simula=- simula: Simula um jogo completo.
menu.tiros=- tiros: Lista os tiros validos realizados (* = tiro em navio, o = tiro na agua)
menu.desisto=- desisto: Encerra o jogo.
menu.exportarpdf=- exportarpdf: Exporta o historico de jogadas para PDF.
menu.lang=- lang [pt/en]: Altera o idioma do jogo / Changes game language.
menu.scoreboard=- scoreboard: Mostra a tabela de pontuações dos jogos passados.
