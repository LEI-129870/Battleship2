menu.header======================= MENU HELP =========================
menu.info=Type one of the commands below to interact with the game:
menu.gerafrota=- gerafrota: Generates a random fleet of ships.
menu.lefrota=- lefrota: Allows creating and loading a custom fleet.
menu.estado=- estado: Shows current fleet status.
menu.mapa=- mapa: Displays fleet map.
menu.rajada=- rajada: Fires a salvo of shots.
menu.simula=- simula: Simulates a full game.
menu.tiros=- tiros: Lists valid shots taken (* = ship hit, o = water hit)
menu.desisto=- desisto: Quits the game.
menu.exportarpdf=- exportarpdf: Exports play history to PDF.
menu.lang=- lang [pt/en]: Altera o idioma do jogo / Changes game language.
menu.footer===============================================================
menu.unknown=What command is that??? Try again ...
menu.goodbye=Fair winds!
menu.pdf.success=PDF exported successfully!
