menu.pdf.nofleet=You must build a fleet first!
map.legend.title=LEGEND
map.legend.line1=\'#\'->ship, \'-\'->adjacent to ship, \'.\'->water
map.legend.line2=\'*\'->Direct hit, \'o\'->Missed shot
